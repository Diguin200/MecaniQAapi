
spring.application.name=mecaniqa-api
server.port=8081

# Conexao JDBC com o MySQL
# Os valores podem ser sobrescritos por variaveis de ambiente.
mecaniqa.db.url=${DB_URL:jdbc:mysql://localhost:3306/mecaniqa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bahia}
mecaniqa.db.user=${DB_USER:root}
mecaniqa.db.password=${DB_PASSWORD:root}
